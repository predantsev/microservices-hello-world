version: '3.8'
services:
  hello-service:
    build:
      context: .
      dockerfile: hello-service/Dockerfile
    container_name: hello-service
    ports:
      - "8080:8080"

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "8081:8080"
    depends_on:
      - hello-service

  counter-service:
    build:
      context: .
      dockerfile: counter-service/Dockerfile
    container_name: counter-service
    ports:
      - "8082:8080"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_DATABASE: callcounter
      MYSQL_ROOT_PASSWORD: example
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3
